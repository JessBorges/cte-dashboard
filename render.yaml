services:
  - type: web
    name: cte-dashboard
    runtime: python
    repo: https://github.com/jborges-dallasisd/cte-dashboard
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cte-dashboard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://cte-dashboard.onrender.com

databases:
  - name: cte-dashboard-db
    plan: free
    databaseName: cte_dashboard
