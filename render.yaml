services:
  - type: web
    name: cte-dashboard
    runtime: python
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://cte-dashboard.onrender.com
